name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; queue instead of cancelling so an
# in-flight release (migrations, service restarts) is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate deploy secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require web, GPU, and Cloudflare secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
          DEPLOY_STACK: ${{ secrets.DEPLOY_STACK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          set -euo pipefail

          missing=0
          for name in \
            SERVER_HOST SERVER_USER SERVER_SSH_KEY \
            GPU_SERVER_HOST \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            API_ORIGIN
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set"
              missing=1
            fi
          done

          stack="${DEPLOY_STACK:-monolith}"
          if [ "$stack" != "monolith" ] && [ "$stack" != "split" ]; then
            echo "::error::DEPLOY_STACK must be 'monolith' or 'split' (got '$stack')"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Deploy targets: web=${SERVER_HOST} gpu=${GPU_SERVER_HOST} stack=${stack} cloudflare=enabled"

  # Cheap syntax gate: catches Python syntax errors before anything touches a
  # server. Full pytest runs need live LLM/API keys, so they stay out of deploy.
  verify-backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend sources
        run: python -m compileall -q AGT_platform/backend/app AGT_platform/backend/alembic

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AGT_platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: AGT_platform/frontend
        run: npm ci

      - name: Build
        working-directory: AGT_platform/frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      # Do not copy Pages `_redirects` into dist/: Workers rejects absolute
      # proxy rules. SPA + /api/* are handled by wrangler.toml / cloudflare-worker.js.
      - name: Strip Pages _redirects from Workers asset output
        working-directory: AGT_platform/frontend
        run: rm -f dist/_redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: AGT_platform/frontend/dist
          if-no-files-found: error
          retention-days: 7

  # --- Web/app tier: FastAPI API (uvicorn) + Alembic migrations.
  # Celery worker is always deployed by deploy-gpu (not restarted here). ---
  deploy-web:
    name: Deploy web / app tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, verify-backend]
    environment: production
    steps:
      - name: Check SSH reachability of SERVER_HOST
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          echo "Probing ${SERVER_HOST}:22…"
          if ! timeout 15 bash -c "echo >/dev/tcp/${SERVER_HOST}/22"; then
            echo "::error::Cannot reach ${SERVER_HOST}:22 from GitHub Actions. Ensure the web host is running and security group/firewall allows SSH from GitHub-hosted runners."
            exit 1
          fi
          echo "SSH port is reachable"

      - name: Deploy backend API to SERVER_HOST
        uses: appleboy/ssh-action@v1
        env:
          AGT_API_SERVICE: ${{ secrets.AGT_API_SERVICE }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          envs: AGT_API_SERVICE,BACKEND_PORT
          script: |
            set -eu

            cd /opt/ai-grader || { echo "Missing /opt/ai-grader checkout"; exit 1; }

            echo "Updating code to origin/main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd AGT_platform/backend

            echo "Syncing Python dependencies"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet -r requirements.txt

            echo "Running database migrations"
            python -m alembic upgrade head

            API="${AGT_API_SERVICE:-agt-api}"
            if systemctl cat "$API.service" >/dev/null 2>&1; then
              echo "Restarting $API"
              sudo systemctl restart "$API"
            else
              echo "::warning::systemd unit $API.service not found on host; restart the API process manually"
            fi

            echo "Waiting for API health check"
            PORT="${BACKEND_PORT:-5000}"
            for _ in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
                echo "Backend healthy on port $PORT — web/app deploy complete"
                exit 0
              fi
              sleep 2
            done
            echo "Backend failed health check on port $PORT"
            exit 1

  # --- GPU inference tier: Celery worker on the gpu queue. Always deployed. ---
  deploy-gpu:
    name: Deploy GPU inference tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, verify-backend]
    environment: production
    steps:
      - name: Check SSH reachability of GPU_SERVER_HOST
        env:
          GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
        run: |
          set -euo pipefail
          echo "Probing ${GPU_SERVER_HOST}:22…"
          if ! timeout 15 bash -c "echo >/dev/tcp/${GPU_SERVER_HOST}/22"; then
            echo "::error::Cannot reach ${GPU_SERVER_HOST}:22 from GitHub Actions. Ensure the GPU host is running and security group/firewall allows SSH from GitHub-hosted runners."
            exit 1
          fi
          echo "SSH port is reachable"

      - name: Deploy worker to GPU_SERVER_HOST
        uses: appleboy/ssh-action@v1
        env:
          AGT_WORKER_SERVICE: ${{ secrets.AGT_WORKER_SERVICE }}
        with:
          host: ${{ secrets.GPU_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          envs: AGT_WORKER_SERVICE
          script: |
            set -eu

            cd /opt/ai-grader || { echo "Missing /opt/ai-grader checkout"; exit 1; }

            echo "Updating code to origin/main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd AGT_platform/backend

            echo "Syncing Python dependencies"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet -r requirements.txt
            if [ -f requirements-huggingface.txt ]; then
              pip install --quiet -r requirements-huggingface.txt
            fi

            WORKER="${AGT_WORKER_SERVICE:-agt-worker}"
            if systemctl cat "$WORKER.service" >/dev/null 2>&1; then
              echo "Restarting $WORKER"
              sudo systemctl restart "$WORKER"
              sleep 5
              systemctl is-active --quiet "$WORKER" || { echo "$WORKER is not active after restart"; exit 1; }
            else
              echo "::warning::systemd unit $WORKER.service not found on host; restart the worker manually"
            fi
            echo "GPU worker deploy complete"

  # --- Frontend: Cloudflare Worker (static assets + /api proxy). Always deployed. ---
  deploy-frontend:
    name: Deploy frontend to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, build-frontend]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: AGT_platform/frontend/dist

      - name: Publish Worker (static assets + /api proxy)
        uses: cloudflare/wrangler-action@v3
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `deploy` uploads a version and promotes it. API_ORIGIN is injected at
          # deploy time from the GitHub secret (never committed in wrangler.toml).
          command: deploy --config wrangler.toml --var API_ORIGIN:${{ secrets.API_ORIGIN }}
