name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; queue instead of cancelling so an
# in-flight release (migrations, service restarts) is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve deploy configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web_configured: ${{ steps.config.outputs.web_configured }}
      gpu_configured: ${{ steps.config.outputs.gpu_configured }}
      cloudflare_configured: ${{ steps.config.outputs.cloudflare_configured }}
    steps:
      - name: Validate secrets and resolve stack mode
        id: config
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GPU_SERVER_HOST: ${{ secrets.GPU_SERVER_HOST }}
          DEPLOY_STACK: ${{ secrets.DEPLOY_STACK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          web_configured=true
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set"
              web_configured=false
            fi
          done

          stack="${DEPLOY_STACK:-monolith}"
          if [ "$stack" != "monolith" ] && [ "$stack" != "split" ]; then
            echo "::error::DEPLOY_STACK must be 'monolith' or 'split' (got '$stack')"
            exit 1
          fi

          gpu_configured=false
          if [ "$stack" = "split" ]; then
            if [ -n "$GPU_SERVER_HOST" ]; then
              gpu_configured=true
            else
              echo "::error::DEPLOY_STACK=split but GPU_SERVER_HOST is not set"
              exit 1
            fi
          fi

          cloudflare_configured=false
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            cloudflare_configured=true
          else
            echo "::warning::Cloudflare secrets not set; the frontend will be built but not deployed"
          fi

          {
            echo "web_configured=$web_configured"
            echo "gpu_configured=$gpu_configured"
            echo "cloudflare_configured=$cloudflare_configured"
          } >> "$GITHUB_OUTPUT"

          echo "stack=$stack web=$web_configured gpu=$gpu_configured cloudflare=$cloudflare_configured"

          if [ "$web_configured" = "false" ]; then
            exit 1
          fi

  # Cheap syntax gate: catches Python syntax errors before anything touches a
  # server. Full pytest runs need live LLM/API keys, so they stay out of deploy.
  verify-backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend sources
        run: python -m compileall -q AGT_platform/backend/app AGT_platform/backend/alembic

  # Always build the frontend (validates the TypeScript/Vite build on every
  # push to main), even when Cloudflare deployment is skipped.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AGT_platform/frontend/package-lock.json

      - name: Install dependencies
        working-directory: AGT_platform/frontend
        run: npm ci

      - name: Build
        working-directory: AGT_platform/frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build

      # Do not copy Pages `_redirects` into dist/: Workers rejects absolute
      # proxy rules. SPA + /api/* are handled by wrangler.toml / cloudflare-worker.js.
      - name: Strip Pages _redirects from Workers asset output
        working-directory: AGT_platform/frontend
        run: rm -f dist/_redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: AGT_platform/frontend/dist
          if-no-files-found: error
          retention-days: 7

  # --- Web/app EC2: FastAPI API (uvicorn). Runs Alembic migrations. Also runs
  # the Celery worker when DEPLOY_STACK=monolith. ---
  deploy-web:
    name: Deploy web / app tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, verify-backend]
    environment: production
    steps:
      - name: Deploy backend to SERVER_HOST
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_STACK: ${{ secrets.DEPLOY_STACK }}
          AGT_API_SERVICE: ${{ secrets.AGT_API_SERVICE }}
          AGT_WORKER_SERVICE: ${{ secrets.AGT_WORKER_SERVICE }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          envs: DEPLOY_STACK,AGT_API_SERVICE,AGT_WORKER_SERVICE,BACKEND_PORT
          script: |
            set -eu

            cd /opt/ai-grader || { echo "Missing /opt/ai-grader checkout"; exit 1; }

            echo "Updating code to origin/main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd AGT_platform/backend

            echo "Syncing Python dependencies"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet -r requirements.txt

            echo "Running database migrations"
            python -m alembic upgrade head

            STACK="${DEPLOY_STACK:-monolith}"
            SERVICES="${AGT_API_SERVICE:-agt-api}"
            if [ "$STACK" != "split" ]; then
              SERVICES="$SERVICES ${AGT_WORKER_SERVICE:-agt-worker}"
            fi

            for svc in $SERVICES; do
              if systemctl cat "$svc.service" >/dev/null 2>&1; then
                echo "Restarting $svc"
                sudo systemctl restart "$svc"
              else
                echo "::warning::systemd unit $svc.service not found on host; restart that process manually"
              fi
            done

            echo "Waiting for API health check"
            PORT="${BACKEND_PORT:-5000}"
            for _ in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
                echo "Backend healthy on port $PORT — web/app deploy complete"
                exit 0
              fi
              sleep 2
            done
            echo "Backend failed health check on port $PORT"
            exit 1

  # --- GPU EC2 (DEPLOY_STACK=split only): Celery worker consuming the "gpu"
  # queue. No migrations here; the web tier owns the schema. ---
  deploy-gpu:
    name: Deploy GPU inference tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, verify-backend]
    if: needs.preflight.outputs.gpu_configured == 'true'
    environment: production
    steps:
      - name: Deploy worker to GPU_SERVER_HOST
        uses: appleboy/ssh-action@v1
        env:
          AGT_WORKER_SERVICE: ${{ secrets.AGT_WORKER_SERVICE }}
        with:
          host: ${{ secrets.GPU_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          envs: AGT_WORKER_SERVICE
          script: |
            set -eu

            cd /opt/ai-grader || { echo "Missing /opt/ai-grader checkout"; exit 1; }

            echo "Updating code to origin/main"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd AGT_platform/backend

            echo "Syncing Python dependencies"
            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet -r requirements.txt
            if [ -f requirements-huggingface.txt ]; then
              pip install --quiet -r requirements-huggingface.txt
            fi

            WORKER="${AGT_WORKER_SERVICE:-agt-worker}"
            if systemctl cat "$WORKER.service" >/dev/null 2>&1; then
              echo "Restarting $WORKER"
              sudo systemctl restart "$WORKER"
              sleep 5
              systemctl is-active --quiet "$WORKER" || { echo "$WORKER is not active after restart"; exit 1; }
            else
              echo "::warning::systemd unit $WORKER.service not found on host; restart the worker manually"
            fi
            echo "GPU worker deploy complete"

  # Matches the Cloudflare Workers Builds path (repo-root wrangler.toml).
  # Uses pre-built dist/ from build-frontend; wrangler [build] no-ops when
  # dist/index.html already exists.
  deploy-frontend:
    name: Deploy frontend to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, build-frontend]
    if: needs.preflight.outputs.cloudflare_configured == 'true'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: AGT_platform/frontend/dist

      - name: Publish Worker (static assets + /api proxy)
        uses: cloudflare/wrangler-action@v3
        env:
          # Injected at deploy time — never committed in wrangler.toml.
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `deploy` uploads a version and promotes it (required for first-time
          # Workers; `versions upload` alone does not create the Worker).
          # API_ORIGIN is passed via --var from the GitHub secret of the same name
          # (set it in repo Secrets, or once in the Cloudflare dashboard).
          command: deploy --config wrangler.toml --var API_ORIGIN:${{ secrets.API_ORIGIN }}
